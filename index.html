<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Insight</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- Hero Section -->

    <header class="hero">

        <h1>
            Business Insight
        </h1>


        <h2>
            تصمیم‌گیری بهتر برای کسب‌وکارها با استفاده از داده
        </h2>


        <p>
            یک داشبورد هوشمند برای مدیریت فروش، هزینه‌ها و تحلیل عملکرد کسب‌وکار
        </p>


        <button>
            ورود به داشبورد
        </button>


    </header>



    <!-- Features Section -->

    <section class="features">


        <h2>
            امکانات سیستم
        </h2>


        <div class="feature-list">


            <div class="card">

                <h3>
                    مدیریت فروش
                </h3>

                <p>
                    ثبت و بررسی فروش‌های کسب‌وکار
                </p>

            </div>



            <div class="card">

                <h3>
                    مدیریت هزینه‌ها
                </h3>

                <p>
                    کنترل هزینه‌ها و بررسی سود
                </p>

            </div>



            <div class="card">

                <h3>
                    گزارش‌های کسب‌وکار
                </h3>

                <p>
                    مشاهده وضعیت کلی کسب‌وکار
                </p>

            </div>


        </div>


    </section>


</body>

</html>
